name: CI/CD Image 2.1

on:
  push:
    branches:
      - dev

jobs:
  nightly-build-push-2-1:
    name: Build and Push Docker Image 2.1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Make
        run: sudo apt-get install -y make

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image for 2.1
        run: |
          make build 2.1
          docker tag casper-nctl-2-docker-2.1 ${{ secrets.DOCKER_USERNAME }}/casper-nctl:2.1

      - name: Push Docker image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/casper-nctl:2.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Tag Docker image for 2.1
        run: |
          docker tag casper-nctl-2-docker-2.1 ghcr.io/groussac/casper-nctl:2.1

      - name: Push Docker image to GHCR
        run: |
          docker push ghcr.io/groussac/casper-nctl:2.1
