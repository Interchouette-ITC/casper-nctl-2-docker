name: CI/CD MCP Image 2.2

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - "mcp/**"
      - "Makefile"
      - "docker-compose.yml"
      - ".github/workflows/docker-build-push-mcp.yml"

permissions:
  contents: read
  packages: write

jobs:
  build-push-mcp:
    name: Build and Push casper-nctl-2-docker-mcp :2.2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build MCP image
        run: make mcp-build
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push to Docker Hub
        run: make mcp-docker-push-hub
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}
      - name: Push to personal GHCR
        run: make mcp-docker-push-ghcr-personal
      - name: Push to org GHCR
        run: make mcp-docker-push-ghcr-itc
