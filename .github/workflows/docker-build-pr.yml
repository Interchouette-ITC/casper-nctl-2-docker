name: CI Image build (PR)

on:
  pull_request:
    branches:
      - dev

# No paths-ignore: branch protection requires these job names on every PR.
# Active PR image builds: 2.2 + cors only (2.1 is parked like push publish).
jobs:
  detect:
    name: Detect Docker-relevant changes
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: filter
        name: Classify changed paths
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          relevant=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              *.md|*.mdc|docs/mkdocs.yml|LICENSE|CHANGELOG.md) continue ;;
            esac
            if [[ "$f" == docs/* || "$f" == .github/* ]]; then
              continue
            fi
            relevant=true
            break
          done < <(git diff --name-only "$BASE"...HEAD)
          echo "docker=${relevant}" >> "$GITHUB_OUTPUT"
          echo "docker-relevant=${relevant}"

  build-2-2:
    name: Build Docker image 2.2
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - name: Skip build
        if: needs.detect.outputs.docker != 'true'
        run: echo skipped
      - if: needs.detect.outputs.docker == 'true'
        uses: actions/checkout@v6
      - if: needs.detect.outputs.docker == 'true'
        uses: docker/setup-buildx-action@v4
      - name: Build 2.2 image
        if: needs.detect.outputs.docker == 'true'
        run: make build 2.2

  build-cors:
    name: Build CORS image
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - name: Skip build
        if: needs.detect.outputs.docker != 'true'
        run: echo skipped
      - if: needs.detect.outputs.docker == 'true'
        uses: actions/checkout@v6
      - if: needs.detect.outputs.docker == 'true'
        uses: docker/setup-buildx-action@v4
      - name: Build cors-anywhere
        if: needs.detect.outputs.docker == 'true'
        run: docker compose --profile cors-anywhere build
