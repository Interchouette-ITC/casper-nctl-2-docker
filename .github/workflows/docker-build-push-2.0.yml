name: CI/CD Image 2.0

on:
  push:
    branches:
      - dev

jobs:
  nightly-build-push-2-0:
    name: Build and Push Docker Image 2.0
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v2

      # Step 2: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      # Step 3: Set up Make
      - name: Set up Make
        run: sudo apt-get install -y make

      # Step 4: Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 5: Build the Docker image using 'make build 2.0'
      - name: Build Docker image for 2.0
        run: |
          make build 2.0
          docker tag casper-nctl-2-docker-2.0 ${{ secrets.DOCKER_USERNAME }}/casper-nctl:2.0

      # Step 6: Push the Docker image to Docker Hub
      - name: Push Docker image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/casper-nctl:2.0

      # Step 7: # Log in to GHCR
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}

      # Step 8: Tag image for 2.0
      - name: Tag Docker image for 2.0
        run: |
          docker tag casper-nctl-2-docker-2.0 ${{ github.repository_owner }}/casper-nctl:2.0

      # Step 9: Push the Docker image to GHCR
      - name: Push Docker image to GHCR
        run: |
          docker push ${{ github.repository_owner }}/casper-nctl:2.0
