name: CI/CD Image 2.0

# Legacy family: publish on demand only (does not run on every push to dev).
on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  nightly-build-push-2-0:
    name: Build and Push Docker Image 2.0
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up Make
        run: sudo apt-get install -y make

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image for 2.0
        run: |
          make build 2.0
          docker tag casper-nctl-2-docker-2.0 interchouette/casper-nctl-2-docker:2.0

      - name: Push Docker image to Docker Hub
        run: |
          docker push interchouette/casper-nctl-2-docker:2.0

      - name: Log in to GHCR (personal)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Tag and push personal GHCR
        run: |
          docker tag casper-nctl-2-docker-2.0 ghcr.io/groussac/casper-nctl-2-docker:2.0
          docker push ghcr.io/groussac/casper-nctl-2-docker:2.0

      - name: Log in to GHCR (Interchouette / ITC)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME_ITC }}
          password: ${{ secrets.GHCR_PAT_ITC }}

      - name: Tag and push worker and org GHCR
        run: |
          docker tag casper-nctl-2-docker-2.0 ghcr.io/interchouette/casper-nctl-2-docker:2.0
          docker tag casper-nctl-2-docker-2.0 ghcr.io/interchouette-itc/casper-nctl-2-docker:2.0
          docker push ghcr.io/interchouette/casper-nctl-2-docker:2.0
          docker push ghcr.io/interchouette-itc/casper-nctl-2-docker:2.0
