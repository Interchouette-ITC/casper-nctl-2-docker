name: CI/CD Image 2.0

on:
  push:
    branches:
      - dev
    paths-ignore:
      - "**/*.md"
      - "**/*.mdc"
      - "docs/**"
      - "mkdocs.yml"
      - "LICENSE"
      - "CHANGELOG.md"

jobs:
  nightly-build-push-2-0:
    name: Build and Push Docker Image 2.0
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Make
        run: sudo apt-get install -y make

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image for 2.0
        run: |
          make build 2.0
          docker tag casper-nctl-2-docker-2.0 ${{ secrets.DOCKER_USERNAME }}/casper-nctl-2-docker:2.0
          docker tag casper-nctl-2-docker-2.0 interchouette/casper-nctl-2-docker:2.0

      - name: Push Docker image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/casper-nctl-2-docker:2.0
          docker push interchouette/casper-nctl-2-docker:2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Tag Docker image for 2.0
        run: |
          docker tag casper-nctl-2-docker-2.0 ghcr.io/groussac/casper-nctl-2-docker:2.0
          docker tag casper-nctl-2-docker-2.0 ghcr.io/interchouette-itc/casper-nctl-2-docker:2.0

      - name: Push Docker image to GHCR
        run: |
          docker push ghcr.io/groussac/casper-nctl-2-docker:2.0
          docker push ghcr.io/interchouette-itc/casper-nctl-2-docker:2.0
