name: CI/CD Image VerQ 2.0

on:
  workflow_dispatch:

jobs:
  nightly-build-push-2_0:
    name: Nightly Build and Push Docker Image 2.0
    runs-on: ubuntu-latest

    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v2

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      # Install Make if needed
      - name: Set up Make
        run: sudo apt-get install -y make

      # Log in to GHCR
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}

      # Build Docker image for 2.0
      - name: Build Docker image for 2.0
        run: |
          make build 2.0
          docker tag casper-nctl-2-docker-2.0 ghcr.io/verqhealth/casper-nctl-2-docker:2.0

      # Push Docker image 2.0 to GHCR
      - name: Push Docker image 2.0 to GHCR
        run: |
          docker push ghcr.io/verqhealth/casper-nctl-2-docker:2.0
