name: MCP package (Rust)

on:
  pull_request:
    paths:
      - "mcp/src/**"
      - "mcp/tests/**"
      - "mcp/examples/**/*.rs"
      - "mcp/Cargo.toml"
      - "mcp/Cargo.lock"
      - "mcp/Dockerfile"
      - ".github/workflows/mcp-ci.yml"
  push:
    branches: [dev]
    paths:
      - "mcp/src/**"
      - "mcp/tests/**"
      - "mcp/examples/**/*.rs"
      - "mcp/Cargo.toml"
      - "mcp/Cargo.lock"
      - "mcp/Dockerfile"
      - ".github/workflows/mcp-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cargo test (lib + integration)
        run: cargo test
      - name: Build examples
        run: cargo build --examples
      - name: Clippy
        run: cargo clippy --all-targets --examples -- -D warnings
      - name: Build MCP image
        run: |
          docker build -t casper-nctl-2-docker-mcp:2.2 -t casper-nctl-2-docker-mcp:latest -t casper-nctl-2-docker-mcp:ci .
