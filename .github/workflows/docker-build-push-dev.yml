name: CI/CD Image dev

on:
  schedule:
    - cron: '0 0 * * *' # This triggers the workflow every day at midnight UTC
  push:
    branches:
      - dev
    paths-ignore:
      - "**/*.md"
      - "**/*.mdc"
      - "docs/**"
      - "docs/mkdocs.yml"
      - "LICENSE"
      - "CHANGELOG.md"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  nightly-build-push-dev:
    name: Nightly Build and Push Docker Image dev
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up Make
        run: sudo apt-get install -y make

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image for dev
        run: |
          make build dev
          docker tag casper-nctl-2-docker-dev interchouette/casper-nctl-2-docker:dev

      - name: Push Docker image to Docker Hub
        run: |
          docker push interchouette/casper-nctl-2-docker:dev

      - name: Log in to GHCR (personal)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Tag and push personal GHCR
        run: |
          docker tag casper-nctl-2-docker-dev ghcr.io/groussac/casper-nctl-2-docker:dev
          docker push ghcr.io/groussac/casper-nctl-2-docker:dev

      - name: Log in to GHCR (Interchouette / ITC)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME_ITC }}
          password: ${{ secrets.GHCR_PAT_ITC }}

      - name: Tag and push worker and org GHCR
        run: |
          docker tag casper-nctl-2-docker-dev ghcr.io/interchouette/casper-nctl-2-docker:dev
          docker tag casper-nctl-2-docker-dev ghcr.io/interchouette-itc/casper-nctl-2-docker:dev
          docker push ghcr.io/interchouette/casper-nctl-2-docker:dev
          docker push ghcr.io/interchouette-itc/casper-nctl-2-docker:dev
