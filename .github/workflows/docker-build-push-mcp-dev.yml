name: CI/CD MCP Image dev

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - "mcp/**"
      - "Makefile"
      - ".github/workflows/docker-build-push-mcp-dev.yml"

permissions:
  contents: read
  packages: write

jobs:
  build-push-mcp-dev:
    name: Build and Push casper-nctl-2-docker-mcp :dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build MCP image :dev
        run: make mcp-build-dev
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push :dev to Docker Hub
        run: make mcp-docker-push-dev-hub
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}
      - name: Push :dev to personal GHCR
        run: make mcp-docker-push-dev-ghcr-personal
      - name: Push :dev to org GHCR
        run: make mcp-docker-push-dev-ghcr-itc
