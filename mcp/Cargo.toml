[package]
name = "casper-nctl-2-docker-mcp"
version = "2.2.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "MCP server for casper-nctl-2-docker (stdio + Streamable HTTP)"
readme = "README.md"
authors = ["Interchouette <contact@interchouette.net>"]

[[bin]]
name = "casper-nctl-2-docker-mcp"
path = "src/main.rs"

[lib]
name = "casper_nctl_2_docker_mcp"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
mcpkit = "0.7"
mcpkit-axum = "0.7"
regex = "1"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "fs", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
opt-level = "s"
