[package]
name = "casper-nctl-2-docker-mcp"
version = "0.3.0"
edition = "2021"
authors = ["Interchouette <contact@interchouette.net>"]
rust-version = "1.85"
license = "Apache-2.0"
description = "MCP server for casper-nctl-2-docker (stdio + Streamable HTTP)"
readme = "README.md"

[[bin]]
name = "casper-nctl-2-docker-mcp"
path = "src/main.rs"

[lib]
name = "casper_nctl_2_docker_mcp"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = [
    "http1",
    "tokio",
    "json",
] }
clap = { version = "4", features = ["derive", "env"] }
regex = "1"
rmcp = { version = "3.1.2", default-features = false, features = [
    "server",
    "macros",
    "transport-io",
    "transport-streamable-http-server",
] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "process",
    "time",
    "fs",
    "io-util",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
opt-level = "s"
