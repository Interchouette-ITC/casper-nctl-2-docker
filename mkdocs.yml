site_name: Casper NCTL 2 Docker
site_description: Local Casper testnet in Docker (casper-nctl-2-docker) with optional Rust MCP
site_url: https://groussac.github.io/casper-nctl-2-docker/
repo_url: https://github.com/gRoussac/casper-nctl-2-docker
edit_uri: edit/dev/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - scheme: slate
      primary: teal
      toggle:
        icon: material/brightness-4
        name: Light mode

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Profiles: profiles.md
  - Ports and RPC: ports-and-rpc.md
  - Assets and logs: assets-and-logs.md
  - CORS: cors.md
  - MCP: mcp.md
  - Versioning: versioning.md
  - Troubleshooting: troubleshooting.md

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - admonition
  - pymdownx.superfences

plugins:
  - search
